[platformio]
default_envs = guition
packages_dir = ../starbreak/.deps/packages

[env:guition]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages = framework-arduinoespressif32 @ symlink://../starbreak/.deps/esp32-bluepad32-4.1.0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11 -Os
build_flags =
 -std=gnu++17
 -O2
 -DBOARD_HAS_PSRAM
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DARDUINO_USB_MODE=1
 -DESP32QSPI_MAX_PIXELS_AT_ONCE=4096
 -Iassets
lib_deps = moononournation/GFX Library for Arduino@1.5.9
upload_speed = 921600
monitor_speed = 115200

[env:validation]
extends = env:guition
build_flags = ${env:guition.build_flags} -DSMSEMU_VALIDATION=1
